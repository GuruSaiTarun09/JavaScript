<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function check() {
            //read
            var age = document.getElementById("age").value;

            //write
            if (age >= 0 && age < 18) {
                document.getElementById("result").innerText = "minor person"
            }
           else if (age >= 18 && age < 100) {
                document.getElementById("result").innerText = "major person"
            }
            else{
                document.getElementById("result").innerText = "invalid age"
            }
        }

    </script>
</head>

<body>
    <h1>Age</h1>
    <label for="">Age:</label>
    <input id="age" type="number">
    <br>
    <button onclick="check()">check</button>
    <h1 id="result">______</h1>
</body>

</html>
