<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
     <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bmi-img{
            height: 300px;
            width: 50%;
        }
        #result1{
            background-color: black;
            color: white;
            width: 100px;
        }
    </style>
   <script>
        var weight, height, bmi;
        function BMI() {
            weight = document.getElementById("weight").value;
            height = document.getElementById("height").value;
            bmi = weight / (height / 100) ** 2;
            document.getElementById("result").innerText = "bmi value is:" + bmi;



            if (bmi < 18.5) {
                document.getElementById("result1").innerText = "underweight"
            }
            else if (bmi >= 18.5 && bmi <= 24.9) {
                document.getElementById("result1").innerText = "normal"
            }
            else if (bmi >= 25 && bmi <= 29.9) {
                document.getElementById("result1").innerText = "overweight"
            }
            else if (bmi >= 30 && bmi <= 34.9) {
                document.getElementById("result1").innerText = "obese"
            }
            else if (bmi > 35) {
                document.getElementById("result1").innerText = "extremely obese"
            }

            else {
                document.getElementById("result1").innerText = "invalid"
            }
        }

    </script>
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="text-center mb-4">
            <h1>BMI Calculator</h1>
            <p>Enter your height (cm) and weight (kg), then click Calculate to see your BMI and category.</p>
        </div>

        <div class="card p-4 shadow-sm">
            <div class="mb-3">
                <label for="height" class="form-label">Height (cm):</label>
                <input type="number" id="height" class="form-control" placeholder="Enter height in cm">
            </div>
            <div class="mb-3">
                <label for="weight" class="form-label">Weight (kg):</label>
                <input type="number" id="weight" class="form-control" placeholder="Enter weight in kg">
            </div>
            <div class="d-flex gap-2 mb-3">
                <button class="btn btn-primary" onclick="BMI()">Calculate</button>
                <button class="btn btn-secondary" >Reset</button>
            </div>
            <hr>
            <p>Formula: BMI = weight (kg) / [height (m)]²</p>
            <h3 id="result">_______</h3><h3 id="result1"></h3>
            
        </div>

        <div class="text-center mt-4">
            <img src="./6ifcondition.html/bmi.png" alt="BMI Chart" class="bmi-img">
            <p>BMI range reference (for quick visual understanding)</p>
        </div>
    </div>

   
</body>

</html>
