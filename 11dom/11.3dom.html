<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function sum() {
            //read
            var number1 = document.getElementById("num1").valueAsNumber;
            var number2 = document.getElementById("num2").valueAsNumber;

            //write
            document.getElementById("result").innerText = "Sum is" + (number1 + number2)
        }
        function sub() {
            //read
            var number1 = document.getElementById("num1").valueAsNumber;
            var number2 = document.getElementById("num2").valueAsNumber;

            //write
            document.getElementById("result1").innerText = "Sum is" + (number1 - number2)
        }
        function multipl() {
            //read
            var number1 = document.getElementById("num1").valueAsNumber;
            var number2 = document.getElementById("num2").valueAsNumber;

            //write
            document.getElementById("result2").innerText = "Sum is" + (number1 * number2)
        }
        function div() {
            //read
            var number1 = document.getElementById("num1").valueAsNumber;
            var number2 = document.getElementById("num2").valueAsNumber;

            //write
            document.getElementById("result3").innerText = "Sum is" + (number1 / number2)
        }
    </script>
</head>

<body>
    <h1>Calculator</h1>

    <label for="">Number1:</label>
    <input id="num1" type="number">
    <label for="">Number2</label>
    <input id="num2" type="number">

    <button onclick="sum()">sum</button>
    <button onclick="sub()">sub</button>
    <button onclick="multipl()">multipl</button>
    <button onclick="div()">div</button>

    <h1 id="result">_____</h1>
    <h1 id="result1">_____</h1>
    <h1 id="result2">_____</h1>
    <h1 id="result3">_____</h1>
</body>

</html>
