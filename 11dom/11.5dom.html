<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interest Calculator (Simple & Compound)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        button {
            width: 100px !important;
            height: 50px;
        }
        h4{
            background-color: black !important;
            color: yellow !important;
        }
    </style>
    <script>
        function SimpleInterest() {
            var siPrincipal = document.getElementById("siPrincipal").valueAsNumber;
            var siRate = document.getElementById("siRate").valueAsNumber;
            var siTime = document.getElementById("siTime").valueAsNumber;
            document.getElementById("result").innerText="Total Amount =" +(siPrincipal+((siPrincipal*siRate*siTime)/100));
        }
                function CompoundInterest() {
            var ciPrincipal1 = document.getElementById("ciPrincipal1").valueAsNumber;
            var ciRate1 = document.getElementById("ciRate1").valueAsNumber;
            var ciTime1 = document.getElementById("ciTime1").valueAsNumber;
            document.getElementById("result1").innerText="Total Amount =" +(ciPrincipal1*(1+ciRate1/100)**ciTime1);        }
                function CompoundInterestmontly() {
            var cimontly3 = document.getElementById("cimontly3").valueAsNumber;
            var cimontlyrate3 = document.getElementById("cimontlyrate3").valueAsNumber;
            var cimontlytime3 = document.getElementById("cimontlytime3").valueAsNumber;
            document.getElementById("result3").innerText="Total Amount =" +(cimontly3 * (1 + cimontlyrate3 / 1200) ** (12 * cimontlytime3));        }
    </script>
</head>

<body class="bg-light">
    <div class="container py-5">
        <h1 class="text-center mb-4">Interest Calculator (Simple & Compound)</h1>

        <!-- Start Bootstrap Grid -->
        <div class="row g-4">

            <!-- Column 1 -->
            <div class="col-md-4">
                <div class="p-4 .bg-light text-black rounded">
                    <form>
                        <h3>Simple Interest</h3>
                        <div class="mb-3 mt-3">
                            <label for="siPrincipal" class="form-label">Principal (₹)</label>
                            <input type="number" class="form-control" id="siPrincipal" placeholder="Enter amount">
                        </div>
                        <div class="mb-3">
                            <label for="siRate" class="form-label">Rate (%)</label>
                            <input type="number" class="form-control" id="siRate" placeholder="Interest rate">
                        </div>
                        <div class="mb-3">
                            <label for="siTime" class="form-label">Time (Years)</label>
                            <input type="number" class="form-control" id="siTime" placeholder="How many years">
                        </div>
                        <div class="text-center">
                            <button onclick="SimpleInterest()" type="button" class="btn btn-primary">Calculate</button>
                            <button type="button" class="btn btn-secondary">Reset</button>
                        </div>
                        <div>
                            <h4 id="result"></h4>
                        </div>

                    </form>
                </div>
            </div>

            <!-- Column 2 -->
            <div class="col-md-4">
                <div class="p-4 .bg-light text-black rounded">
                    <form>
                        <h3>Compound Interest(Yearly)</h3>
                        <div class="mb-3 mt-3">
                            <label for="ciPrincipal" class="form-label">Principal (₹)</label>
                            <input type="number" class="form-control" id="ciPrincipal1" placeholder="Enter amount">
                        </div>
                        <div class="mb-3">
                            <label for="ciRate" class="form-label">Rate (%)</label>
                            <input type="number" class="form-control" id="ciRate1" placeholder="Interest rate">
                        </div>
                        <div class="mb-3">
                            <label for="ciTime" class="form-label">Time (Years)</label>
                            <input type="number" class="form-control" id="ciTime1" placeholder="How many years">
                        </div>
                        <div class="text-center">
                            <button onclick="CompoundInterest()" type="button" class="btn btn-success">Calculate</button>
                            <button type="button" class="btn btn-secondary">Reset</button>
                        </div>
                        <div>
                            <h4 id="result1"></h4>
                        </div>

                    </form>
                </div>
            </div>

            <!-- Column 3 -->
            <div class="col-md-4">
                <div class="p-4 bg-light text-black rounded">
                    <form>
                        <h3>Compound Interest(montly)</h3>
                        <div class="mb-3 mt-3">
                            <label for="p3" class="form-label">Principal (₹)</label>
                            <input type="number" class="form-control" id="cimontly3" placeholder="Enter amount">
                        </div>
                        <div class="mb-3">
                            <label for="r3" class="form-label">Rate (%)</label>
                            <input type="number" class="form-control" id="cimontlyrate3" placeholder="Interest rate">
                        </div>
                        <div class="mb-3">
                            <label for="t3" class="form-label">Time (Years)</label>
                            <input type="number" class="form-control" id="cimontlytime3" placeholder="How many years">
                        </div>
                        <div class="text-center">
                            <button onclick="CompoundInterestmontly()" type="button" class="btn btn-danger">Calculate</button>
                            <button type="button" class="btn btn-secondary">Reset</button>
                        </div>
                        <div>
                            <h4 id="result3"></h4>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</body>

</html>
