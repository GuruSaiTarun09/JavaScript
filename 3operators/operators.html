<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // arithmatic operators: + - * / %
        var a = 20;
        var b = 30;
        console.log(a + b);

        var c = 20;
        var d = 10;
        console.log(c - d);

        var e = 10;
        var f = 5;
        console.log(e * f);

        var g = 5;
        var h = 2;
        console.log(g / h, g % h);

        //comparision operators: > < >= <= ==
        // output: true/false
        var i = 30;
        var j = 40;
        console.log(i > j);

        var k = 30;
        var l = 40;
        console.log(k==l);
        console.log(2 == "2");
        console.log(2 === "2");

        //logical operator: &&  ||  !
          let price = 3000;

        if(price>1000 && price<3000){}

        let product= [
            {mobile: 'flip', brand:'samsung'},
            {mobile: '17 pro max', brand:'iphone'}
        ]

        if(product.brand=='samsung' || product.brand=='iphone'){}

        if(product.brand!=='iphone'){}

        //ternary operator
        let age =20;
        let result =age>18? 'major' : 'minor';
        console.log(result);

        let marks=44;
        let result1=marks>50? 'pass' : 'fail';
        console.log(result1);
    </script>
</head>
