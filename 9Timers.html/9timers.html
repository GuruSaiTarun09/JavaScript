<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var count = 0;

        setTimeout(() => {
            document.getElementById("wish").innerText= "welcome to my website" ;
        }, 5000);

        setInterval(() => {
            count++,
            document.getElementById("display").innerText=count;
        }, 1000);
    </script>
</head>
<body>
    <h1 id="wish"></h1>

    <h1 id="display"></h1>
</body>
</html>
