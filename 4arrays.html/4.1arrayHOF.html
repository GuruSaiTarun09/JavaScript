<html>
    <head>

        <script>
            var prices = [100,400,300,200,500];

            // map - alter every element
            var offerPrices = prices.map(price=>price+20);
            console.log(offerPrices);

            // filter - select some
            var lowPrices = prices.filter(price=>price<300);
            console.log(lowPrices);

            // sort - asc(a-b)/desc(b-a) order
            prices.sort((a, b)=>a-b);
            console.log(prices);

            // reduce - single (total)
            var total = prices.reduce((sum,price)=>sum+price,0);
            console.log(total);



            var products = [
                {name:'pen', price:10, rating:4, category:'book'},
                {name:'iphone 17', price:120000, rating:4.5, category:'mobiles'},
                {name:'samsung f16', price:10000, rating:4.2, category:'mobiles'},
                {name:'samsung 3g', price:80000, rating:4.1, category:'mobiles'},
                {name:'samsung flip', price:40000, rating:3, category:'mobiles'},
                {name:'puma', price:1000, rating:3.5, category:'footware'},
                {name:'crocs', price:3000, rating:4.2, category:'footware'},
                {name:'t-shirt', price:1000, rating:2.5, category:'mensware'},
            ];
                ///find
                console.log(products.find(product=> product.price==3000));

                //some:true/false
                console.log(products.some(product=>product.price<50));

                //every:true/false
                console.log(products.every(product=>product.rating>2));

            // map
            charges = products.map(product=>product.price+20);
            console.log(charges);

            productsWithCharges = products.map(product=>{
                product.price = product.price+20;
                return product;
            });
            console.log(productsWithCharges);

            // filter
            below5kproducts = products.filter(product=>product.price<5000);
            console.log(below5kproducts);
  
            // sort
            priceLH = products.sort((a,b)=>a.price-b.price);
            console.log(priceLH);

            // reduce
            total = products.reduce((sum,product)=>sum+product.price,0);
            console.log(total);


            // mobiles -> 4* above -> priceLH -> total
            var priceToPay = products.filter(product=>product.category=='mobiles')
                                     .filter(product=>product.rating>=4)
                                     .sort((a,b)=>a.price-b.price)
                                     .reduce((sum,product)=>sum+product.price,0);

            console.log(priceToPay);

        </script>
    </head>

    </body>
</html>
